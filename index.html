<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite 3D ASCII Maze Matrix (Border-Fit Scale)</title>
  <style>
    body,
    html {
      background-color: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: monospace;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #logo-container {
      position: absolute;
      top: 25px;
      left: 2vw;
      margin: 0;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: 3.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;

      /* CRT Glow & Shadow Layering */
      text-shadow:
        0 0 4px rgba(0, 255, 102, 0.9),
        0 0 10px rgba(0, 255, 102, 0.4),
        0 0 20px rgba(0, 255, 102, 0.2);

      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    #display-container {
      position: absolute;
      width: 90vw;
      height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #00ff66;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      background-color: #000;
      overflow: hidden;
    }

    #display {
      color: #00ff66;
      background-color: #000;
      font-family: 'Courier New', Courier, monospace;
      white-space: pre;
      margin: 0;
      padding: 0;
      user-select: none;
      pointer-events: none;
      font-size: 0.25vw;
      line-height: 0.772vh;
      letter-spacing: 0px;
    }

    #pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      opacity: 1;
      transition: opacity 0.2s ease;
      pointer-events: auto;
      cursor: crosshair;
    }

    #pause-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .pause-box {
      border: 2px dashed #00ff66;
      padding: 30px 50px;
      text-align: center;
      background: rgba(0, 20, 5, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.1);
    }

    .pause-title {
      color: #00ff66;
      font-size: 2rem;
      font-weight: bold;
      margin: 0 0 15px 0;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #00ff66;
    }

    .pause-sub {
      color: #88ffaa;
      font-size: 1rem;
      margin: 0;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 1;
      }
    }

    #ui-panel {
      position: absolute;
      bottom: 35px;
      width: 100%;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #00ff66;
      z-index: 9999;
      pointer-events: none;
      text-shadow: 0 0 4px #000, 0 0 4px #000;
    }

    .instructions {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      color: #557;
      font-size: 0.8rem;
      z-index: 10;
      text-shadow: 0 0 4px #000, 0 0 4px #000;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="logo-container">uselesswebsites but its an ascii maze</div>

  <div id="display-container">
    <pre id="display"></pre>

    <div id="pause-overlay">
      <div class="pause-box">
        <p class="pause-title">|| MATRIX PAUSED</p>
        <p class="pause-sub">CLICK TO RESUME FEED</p>
      </div>
    </div>
  </div>

  <div id="ui-panel">Initializing widescreen matrix...</div>
  <div class="instructions">Click screen to lock mouse look | Move Mouse to Look | WASD / Arrows to Move | Left-Click
    when target unlocked to Warp</div>

  <script src="script.js"></script>
</body>

</html>
